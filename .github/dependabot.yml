version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
